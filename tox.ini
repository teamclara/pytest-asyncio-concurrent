# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py38,py39,py310,py311,py312,py313,py314,py315,flake8
isolated_build = true
passenv =
    CI

[testenv]
deps = 
    pytest>=6.2.0
    pytest-asyncio>=0.24.0
    coverage>=7.6.0
commands = coverage run -m pytest {posargs:tests}

[testenv:flake8]
skip_install = true
deps = 
    flake8 
    flake8-pyproject
commands = flake8 pytest_asyncio_concurrent tests

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315